      title = {On Time Series Clustering with Graph Neural Networks},
      author = {Jonas Berg Hansen and Andrea Cini and Filippo Maria Bianchi},
      journal = {Transactions on Machine Learning Research},
      issn = {2835-8856},
      year = {2025},
      url = {https://openreview.net/forum?id=MHQXfiXsr3}
    }
- title: Graph Deep Learning for Time Series Forecasting
  authors: A. Cini, I. Marisca, D. Zambon, C. Alippi
  venue: ACM Computing Surveys
  year: 2025
  url: https://doi.org/10.1145/3742784
  pdf: https://arxiv.org/pdf/2310.15978
  abstract: >-
    Graph deep learning methods have become popular tools to process collections of correlated time series.
    Unlike traditional multivariate forecasting methods, graph-based predictors leverage pairwise relationships
    by conditioning forecasts on graphs spanning the time series collection. The conditioning takes the
    form of architectural inductive biases on the forecasting architecture, resulting in a family of models
    called spatiotemporal graph neural networks. These biases allow for training global forecasting models
    on large collections of time series while localizing predictions w.r.t. each element in the set (nodes)
    by accounting for correlations among them (edges). Recent advances in graph neural networks and deep
    learning for time series forecasting make the adoption of such processing framework appealing and
    timely. However, most studies focus on refining existing architectures by exploiting modern deep-learning
    practices. Conversely, foundational and methodological aspects have not been subject to systematic
    investigation. To fill this void, this tutorial paper aims to introduce a comprehensive methodological
    framework formalizing the forecasting problem and providing design principles for graph-based predictors,
    as well as methods to assess their performance. In addition, together with an overview of the field,
    we provide design guidelines and best practices, as well as an in-depth discussion of open challenges
    and future directions.
  bibtex: |-
    @article{cini2025graph,
      title = {{Graph Deep Learning for Time Series Forecasting}},
      author = {Andrea Cini and Ivan Marisca and Daniele Zambon and Cesare Alippi},
      journal = {ACM Computing Surveys},
      year = {2025},
      volume = {57},
      number = {12},
      pages = {1--34},
      doi = {10.1145/3742784},
      url = {https://doi.org/10.1145/3742784}
    }
- title: On the Regularization of Learnable Embeddings for Time Series Forecasting
  authors: L. Butera, G. De Felice, A. Cini, C. Alippi
  venue: TMLR
  year: 2025
  url: https://openreview.net/forum?id=F5ALCh3GWG
  pdf: https://arxiv.org/pdf/2410.14630
  code: https://github.com/LucaButera/TS-embedding-regularization
  abstract: >-
    In forecasting multiple time series, accounting for the individual features of each sequence can be
    challenging. To address this, modern deep learning methods for time series analysis combine a shared
    (global) model with local layers, specific to each time series, often implemented as learnable embeddings.
    Ideally, these local embeddings should encode meaningful representations of the unique dynamics of
    each sequence. However, when these are learned end-to-end as parameters of a forecasting model, they
    may end up acting as mere sequence identifiers. Shared processing blocks may then become reliant on
    such identifiers, limiting their transferability to new contexts. In this paper, we address this issue
    by investigating methods to regularize the learning of local learnable embeddings for time series
    processing. Specifically, we perform the first extensive empirical study on the subject and show how
    such regularizations consistently improve performance in widely adopted architectures. Furthermore,
    we show that methods attempting to prevent the co-adaptation of local and global parameters by means
    of embeddings perturbation are particularly effective in this context. In this regard, we include
    in the comparison several perturbation-based regularization methods, going as far as periodically
    resetting the embeddings during training. The obtained results provide an important contribution to
    understanding the interplay between learnable local parameters and shared processing layers: a key
    challenge in modern time series processing models and a step toward developing effective foundation
    models for time series.
  bibtex: |-
    @article{butera2025regularization,
      title = {{On the Regularization of Learnable Embeddings for Time Series Forecasting}},
      author = {Luca Butera and Giovanni De Felice and Andrea Cini and Cesare Alippi},
      journal = {Transactions on Machine Learning Research},
      year = {2025},
      url = {https://openreview.net/forum?id=F5ALCh3GWG}
    }
- title: Mapping the Dynamics of Atrial Fibrillation with Spatiotemporal Graph Neural Networks
