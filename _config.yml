# Social links (leave empty to hide)
social:
  email: andrea.cini@epfl.ch
  scholar: bQI2UIUAAAAJ
  github: andreacini
  twitter: andreacini1994

# Top navigation. External links open as-is.
nav:
  - title: Publications
    url: /publications/
  - title: Projects
    url: /projects/
  - title: Open source
    url: /open-source/

news_limit: 5

