# -----------------------------------------------------------------------------
# Build
# -----------------------------------------------------------------------------

collections:
  news:
    output: false

include: ['_pages']
exclude:
  - bin
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - vendor
  - _bibliography
keep_files:
  - CNAME
  - .nojekyll
  - .git

markdown: kramdown
kramdown:
  input: GFM

sass:
  style: compressed

plugins:
  - jekyll-sitemap

defaults:
  - scope:
      path: "assets/**/*.*"
    values:
      sitemap: false
