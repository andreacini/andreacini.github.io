{%- assign news = site.news | sort: "date" | reverse -%}
{%- assign limit = include.limit | default: news.size -%}
<ul class="news">
  {%- for item in news limit: limit %}
  <li>
    <time datetime="{{ item.date | date_to_xmlschema }}">{{ item.date | date: "%b %Y" }}</time>
    <div>{{ item.content | remove: '<p>' | remove: '</p>' | strip }}</div>
  </li>
  {%- endfor %}
</ul>
