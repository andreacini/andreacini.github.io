# Open-source projects, rendered on /open-source/.

- name: Torch Spatiotemporal (tsl)
  logo: /assets/img/tsl_logo.svg
  role: Co-lead
  description: >-
    A PyTorch library built to accelerate research on deep learning for spatiotemporal data
    processing, with a focus on graph neural networks. Built on PyTorch, PyG and PyTorch Lightning, it covers
    the whole pipeline from data preprocessing to model prototyping, with ready-to-use datasets,
    baselines and modular spatiotemporal layers. I co-lead its development with
    <a href="https://marshka.github.io/">Ivan Marisca</a>.
  links:
    - title: GitHub
      url: https://github.com/TorchSpatiotemporal/tsl
    - title: Documentation
      url: https://torch-spatiotemporal.readthedocs.io/
    - title: PyPI
      url: https://pypi.org/project/torch-spatiotemporal/
