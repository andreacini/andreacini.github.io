- title: Graph-based Virtual Sensing from Sparse and Partial Multivariate Observations
  authors: G. De Felice, A. Cini, D. Zambon, V. Gusev, C. Alippi
  venue: ICLR
  year: 2024
  url: https://openreview.net/forum?id=CAqdG2dy5s
  pdf: https://arxiv.org/pdf/2402.12598
  code: https://github.com/gdefe/ggnet-virtual-sensing
  abstract: >-
    Virtual sensing techniques allow for inferring signals at new unmonitored locations by exploiting
    spatio-temporal measurements coming from physical sensors at different locations. However, as the
    sensor coverage becomes sparse due to costs or other constraints, physical proximity cannot be used
    to support interpolation. In this paper, we overcome this challenge by leveraging dependencies between
    the target variable and a set of correlated variables (covariates) that can frequently be associated
    with each location of interest. From this viewpoint, covariates provide partial observability, and
    the problem consists of inferring values for unobserved channels by exploiting observations at other
    locations to learn how such variables can correlate. We introduce a novel graph-based methodology
    to exploit such relationships and design a graph deep learning architecture, named GgNet, implementing
    the framework. The proposed approach relies on propagating information over a nested graph structure
    that is used to learn dependencies between variables as well as locations. GgNet is extensively evaluated
    under different virtual sensing scenarios, demonstrating higher reconstruction accuracy compared to
    the state-of-the-art.
  bibtex: |-
    @inproceedings{defelice2024graph,
      title = {{Graph-based Virtual Sensing from Sparse and Partial Multivariate Observations}},
      author = {Giovanni De Felice and Andrea Cini and Daniele Zambon and Vladimir V. Gusev and Cesare Alippi},
      booktitle = {International Conference on Learning Representations},
      year = {2024},
      url = {https://openreview.net/forum?id=CAqdG2dy5s}
    }
- title: Graph-based Time Series Clustering for End-to-End Hierarchical Forecasting
  authors: A. Cini, D. Mandic, C. Alippi
  venue: ICML
  year: 2024
  url: https://openreview.net/forum?id=nd47Za5jk5
  pdf: https://arxiv.org/pdf/2305.19183
  code: https://github.com/andreacini/higp
  abstract: >-
    Relationships among time series can be exploited as inductive biases in learning effective forecasting
    models. In hierarchical time series, relationships among subsets of sequences induce hard constraints
    (hierarchical inductive biases) on the predicted values. In this paper, we propose a graph-based methodology
    to unify relational and hierarchical inductive biases in the context of deep learning for time series
    forecasting. In particular, we model both types of relationships as dependencies in a pyramidal graph
    structure, with each pyramidal layer corresponding to a level of the hierarchy. By exploiting modern
    - trainable - graph pooling operators we show that the hierarchical structure, if not available as
    a prior, can be learned directly from data, thus obtaining cluster assignments aligned with the forecasting
    objective. A differentiable reconciliation stage is incorporated into the processing architecture,
    allowing hierarchical constraints to act both as an architectural bias as well as a regularization
    element for predictions. Simulation results on representative datasets show that the proposed method
    compares favorably against the state of the art.
  bibtex: |-
    @inproceedings{cini2024graph,
      title = {{Graph-based Time Series Clustering for End-to-End Hierarchical Forecasting}},
      author = {Cini, Andrea and Mandic, Danilo and Alippi, Cesare},
      booktitle = {Proceedings of the 41st International Conference on Machine Learning},
      pages = {8985--8999},
      year = {2024},
      volume = {235},
      series = {Proceedings of Machine Learning Research},
      publisher = {PMLR},
      url = {https://proceedings.mlr.press/v235/cini24a.html}
    }
- title: Feudal Graph Reinforcement Learning
  authors: T. Marzi, A. S. Khehra, A. Cini, C. Alippi
  venue: TMLR
  year: 2024
  url: https://openreview.net/forum?id=wFcyJTik90
  pdf: https://arxiv.org/pdf/2304.05099
  code: https://github.com/tommasomarzi/fgrl
  abstract: >-
    Graph-based representations and message-passing modular policies constitute prominent approaches to
    tackling composable control problems in reinforcement learning (RL). However, as shown by recent graph
    deep learning literature, such local message-passing operators can create information bottlenecks
    and hinder global coordination. The issue becomes more serious in tasks requiring high-level planning.
    In this work, we propose a novel methodology, named Feudal Graph Reinforcement Learning (FGRL), that
    addresses such challenges by relying on hierarchical RL and a pyramidal message-passing architecture.
    In particular, FGRL defines a hierarchy of policies where high-level commands are propagated from
    the top of the hierarchy down through a layered graph structure. The bottom layers mimic the morphology
    of the physical system, while the upper layers correspond to higher-order sub-modules. The resulting
    agents are then characterized by a committee of policies where actions at a certain level set goals
    for the level below, thus implementing a hierarchical decision-making structure that can naturally
    implement task decomposition. We evaluate the proposed framework on a graph clustering problem and
    MuJoCo locomotion tasks; simulation results show that FGRL compares favorably against relevant baselines.
    Furthermore, an in-depth analysis of the command propagation mechanism provides evidence that the
    introduced message-passing scheme favors learning hierarchical decision-making policies.
  bibtex: |-
    @article{marzi2024feudal,
      title = {{Feudal Graph Reinforcement Learning}},
      author = {Tommaso Marzi and Arshjot Singh Khehra and Andrea Cini and Cesare Alippi},
      journal = {Transactions on Machine Learning Research},
      year = {2024},
      url = {https://openreview.net/forum?id=wFcyJTik90}
    }
- title: Object-Centric Relational Representations for Image Generation
  authors: L. Butera, A. Cini, A. Ferrante, C. Alippi
  venue: TMLR
  year: 2024
  url: https://openreview.net/forum?id=7kWjB9zW90
  pdf: https://arxiv.org/pdf/2303.14681
  code: https://github.com/LucaButera/graphose_ocrrig
  abstract: >-
    Conditioning image generation on specific features of the desired output is a key ingredient of modern
    generative models. However, existing approaches lack a general and unified way of representing structural
    and semantic conditioning at diverse granularity levels. This paper explores a novel method to condition
    image generation, based on object-centric relational representations. In particular, we propose a
    methodology to condition the generation of objects in an image on the attributed graph representing
    their structure and the associated semantic information. We show that such architectural biases entail
    properties that facilitate the manipulation and conditioning of the generative process and allow for
    regularizing the training procedure. The proposed conditioning framework is implemented by means of
    a neural network that learns to generate a 2D, multi-channel, layout mask of the objects, which can
    be used as a soft inductive bias in the downstream generative task. To do so, we leverage both 2D
    and graph convolutional operators. We also propose a novel benchmark for image generation consisting
    of a synthetic dataset of images paired with their relational representation. Empirical results show
    that the proposed approach compares favorably against relevant baselines.
  bibtex: |-
    @article{butera2024object,
      title = {{Object-Centric Relational Representations for Image Generation}},
      author = {Luca Butera and Andrea Cini and Alberto Ferrante and Cesare Alippi},
      journal = {Transactions on Machine Learning Research},
      year = {2024},
      url = {https://openreview.net/forum?id=7kWjB9zW90}
    }
- title: Taming Local Effects in Graph-based Spatiotemporal Forecasting
  authors: A. Cini, I. Marisca, D. Zambon, C. Alippi
  venue: NeurIPS
  year: 2023
  url: https://openreview.net/forum?id=x2PH6q32LR
  pdf: https://arxiv.org/pdf/2302.04071
  code: https://github.com/Graph-Machine-Learning-Group/taming-local-effects-stgnns
  abstract: >-
    Spatiotemporal graph neural networks have shown to be effective in time series forecasting applications,
    achieving better performance than standard univariate predictors in several settings. These architectures
    take advantage of a graph structure and relational inductive biases to learn a single (global) inductive
    model to predict any number of the input time series, each associated with a graph node. Despite the
    gain achieved in computational and data efficiency w.r.t. fitting a set of local models, relying on
    a single global model can be a limitation whenever some of the time series are generated by a different
    spatiotemporal stochastic process. The main objective of this paper is to understand the interplay
    between globality and locality in graph-based spatiotemporal forecasting, while contextually proposing
    a methodological framework to rationalize the practice of including trainable node embeddings in such
    architectures. We ascribe to trainable node embeddings the role of amortizing the learning of specialized
    components. Moreover, embeddings allow for 1) effectively combining the advantages of shared message-passing
    layers with node-specific parameters and 2) efficiently transferring the learned model to new node
    sets. Supported by strong empirical evidence, we provide insights and guidelines for specializing
    graph-based models to the dynamics of each time series and show how this aspect plays a crucial role
    in obtaining accurate predictions.
  bibtex: |-
    @inproceedings{cini2023taming,
      title = {{Taming Local Effects in Graph-based Spatiotemporal Forecasting}},
      author = {Andrea Cini and Ivan Marisca and Daniele Zambon and Cesare Alippi},
      booktitle = {Advances in Neural Information Processing Systems 36},
      year = {2023},
      pages = {55375--55393},
      doi = {10.52202/075280-2417},
      url = {https://openreview.net/forum?id=x2PH6q32LR}
    }
- title: Scalable Spatiotemporal Graph Neural Networks
  authors: A. Cini, I. Marisca, F. M. Bianchi, C. Alippi
  venue: AAAI
  year: 2023
  url: https://ojs.aaai.org/index.php/AAAI/article/view/25880
  pdf: https://arxiv.org/pdf/2209.06520
  code: https://github.com/Graph-Machine-Learning-Group/sgp
  abstract: >-
    Neural forecasting of spatiotemporal time series drives both research and industrial innovation in
    several relevant application domains. Graph neural networks (GNNs) are often the core component of
    the forecasting architecture. However, in most spatiotemporal GNNs, the computational complexity scales
    up to a quadratic factor with the length of the sequence times the number of links in the graph, hence
    hindering the application of these models to large graphs and long temporal sequences. While methods
    to improve scalability have been proposed in the context of static graphs, few research efforts have
    been devoted to the spatiotemporal case. To fill this gap, we propose a scalable architecture that
    exploits an efficient encoding of both temporal and spatial dynamics. In particular, we use a randomized
    recurrent neural network to embed the history of the input time series into high-dimensional state
    representations encompassing multi-scale temporal dynamics. Such representations are then propagated
    along the spatial dimension using different powers of the graph adjacency matrix to generate node
    embeddings characterized by a rich pool of spatiotemporal features. The resulting node embeddings
    can be efficiently pre-computed in an unsupervised manner, before being fed to a feed-forward decoder
    that learns to map the multi-scale spatiotemporal representations to predictions. The training procedure
    can then be parallelized node-wise by sampling the node embeddings without breaking any dependency,
    thus enabling scalability to large networks. Empirical results on relevant datasets show that our
    approach achieves results competitive with the state of the art, while dramatically reducing the computational
    burden.
  bibtex: |-
    @inproceedings{cini2023scalable,
      title = {{Scalable Spatiotemporal Graph Neural Networks}},
      author = {Andrea Cini and Ivan Marisca and Filippo Maria Bianchi and Cesare Alippi},
      booktitle = {Proceedings of the AAAI Conference on Artificial Intelligence},
      year = {2023},
      volume = {37},
      number = {6},
      pages = {7218--7226},
      doi = {10.1609/aaai.v37i6.25880},
      url = {https://ojs.aaai.org/index.php/AAAI/article/view/25880}
    }
- title: Sparse Graph Learning from Spatiotemporal Time Series
  authors: A. Cini, D. Zambon, C. Alippi
  venue: JMLR
  year: 2023
  url: http://jmlr.org/papers/v24/22-1154.html
  pdf: https://jmlr.org/papers/volume24/22-1154/22-1154.pdf
  code: https://github.com/andreacini/sparse-graph-learning
  abstract: >-
    Outstanding achievements of graph neural networks for spatiotemporal time series analysis show that
    relational constraints introduce an effective inductive bias into neural forecasting architectures.
    Often, however, the relational information characterizing the underlying data-generating process is
    unavailable and the practitioner is left with the problem of inferring from data which relational
    graph to use in the subsequent processing stages. We propose novel, principled - yet practical - probabilistic
    score-based methods that learn the relational dependencies as distributions over graphs while maximizing
    end-to-end the performance at task. The proposed graph learning framework is based on consolidated
    variance reduction techniques for Monte Carlo score-based gradient estimation, is theoretically grounded,
    and, as we show, effective in practice. In this paper, we focus on the time series forecasting problem
    and show that, by tailoring the gradient estimators to the graph learning problem, we are able to
    achieve state-of-the-art performance while controlling the sparsity of the learned graph and the computational
    scalability. We empirically assess the effectiveness of the proposed method on synthetic and real-world
    benchmarks, showing that the proposed solution can be used as a stand-alone graph identification procedure
    as well as a graph learning component of an end-to-end forecasting architecture.
  bibtex: |-
    @article{JMLR:v24:22-1154,
      author  = {Andrea Cini and Daniele Zambon and Cesare Alippi},
      title   = {Sparse Graph Learning from Spatiotemporal Time Series},
      journal = {Journal of Machine Learning Research},
      year    = {2023},
      volume  = {24},
      number  = {242},
      pages   = {1--36},
      url     = {http://jmlr.org/papers/v24/22-1154.html}
    }
- title: 'Peak Shaving in Distribution Networks Using Stationary Energy Storage Systems: A Swiss Case
    Study'
  authors: N. A. Efkarpidis, S. Imoscopi, M. Geidl, A. Cini, S. Lukovic, C. Alippi, I. Herbst
  venue: Sustainable Energy, Grids and Networks
  year: 2023
  url: https://www.sciencedirect.com/science/article/pii/S2352467723000267
  pdf: https://www.sciencedirect.com/science/article/pii/S2352467723000267/pdfft
  abstract: >-
    Large-scale customers and grid operators are charged not only by their total energy demand, but also
    by their highest power demand. The maximum demand charge is usually imposed on the peak power point
    of the monthly load profile, hence, shaving demand at peak times is of main concern for the aforesaid
    stakeholders. In this paper, we present an approach for peak shaving in a distribution grid using
    a battery energy storage. The developed algorithm is applied and tested with data from a real stationary
    battery installation at a Swiss utility. This paper proposes a battery storage control scheme that
    can be used for peak shaving of the total grid load under real-time conditions. Particularly, a rule-based
    approach combined with a deep-learning load forecasting model is developed and its performance is
    compared with the theoretical optimum based on real load data. The analysis includes both technical
    and economical results from a simulated storage operation and significant outcomes are given for the
    application of this method.
  bibtex: |-
    @article{efkarpidis2023peak,
      title = {{Peak Shaving in Distribution Networks Using Stationary Energy Storage Systems: A Swiss Case Study}},
      author = {Nikolaos A. Efkarpidis and Stefano Imoscopi and Martin Geidl and Andrea Cini and Slobodan Lukovic and Cesare Alippi and Ingo Herbst},
      journal = {Sustainable Energy, Grids and Networks},
      year = {2023},
      volume = {34},
      pages = {101018},
      doi = {10.1016/j.segan.2023.101018},
      url = {https://www.sciencedirect.com/science/article/pii/S2352467723000267}
    }
- title: Learning to Reconstruct Missing Data from Spatiotemporal Graphs with Sparse Observations
  authors: I. Marisca, A. Cini, C. Alippi
  venue: NeurIPS
  year: 2022
  url: https://doi.org/10.52202/068431-2324
  pdf: https://arxiv.org/pdf/2205.13479
  code: https://github.com/Graph-Machine-Learning-Group/spin
  abstract: >-
    Modeling multivariate time series as temporal signals over a (possibly dynamic) graph is an effective
    representational framework that allows for developing models for time series analysis. In fact, discrete
    sequences of graphs can be processed by autoregressive graph neural networks to recursively learn
    representations at each discrete point in time and space. Spatiotemporal graphs are often highly sparse,
    with time series characterized by multiple, concurrent, and long sequences of missing data, e.g.,
    due to the unreliable underlying sensor network. In this context, autoregressive models can be brittle
    and exhibit unstable learning dynamics. The objective of this paper is, then, to tackle the problem
    of learning effective models to reconstruct, i.e., impute, missing data points by conditioning the
    reconstruction only on the available observations. In particular, we propose a novel class of attention-based
    architectures that, given a set of highly sparse discrete observations, learn a representation for
    points in time and space by exploiting a spatiotemporal propagation architecture aligned with the
    imputation task. Representations are trained end-to-end to reconstruct observations w.r.t. the corresponding
    sensor and its neighboring nodes. Compared to the state of the art, our model handles sparse data
    without propagating prediction errors or requiring a bidirectional model to encode forward and backward
    time dependencies. Empirical results on representative benchmarks show the effectiveness of the proposed
    method.
  bibtex: |-
    @inproceedings{marisca2022learning,
      title = {{Learning to Reconstruct Missing Data from Spatiotemporal Graphs with Sparse Observations}},
      author = {Ivan Marisca and Andrea Cini and Cesare Alippi},
      booktitle = {Advances in Neural Information Processing Systems 35},
      year = {2022},
      pages = {32069--32082},
      doi = {10.52202/068431-2324},
      url = {https://doi.org/10.52202/068431-2324}
    }
- title: Spatio-Temporal Graph Neural Networks for Aggregate Load Forecasting
  authors: S. Eandi, A. Cini, S. Lukovic, C. Alippi
  venue: IJCNN
  year: 2022
  url: https://ieeexplore.ieee.org/document/9892780
  pdf: /assets/pdf/eandi2022spatio.pdf
  abstract: >-
    Accurate forecasting of electricity demand is a core component of the modern electricity infrastructure.
    Several approaches exist that tackle this problem by exploiting modern deep learning tools. However,
    most previous works focus on predicting the total load as a univariate time series forecasting task,
    ignoring all fine-grained information captured by the smart meters distributed across the power grid.
    We introduce a methodology to account for this information in the graph neural network framework.
    In particular, we consider spatio-temporal graphs where each node is associated with the aggregate
    load of a cluster of smart meters, and a global graph-level attribute indicates the total load on
    the grid. We propose two novel spatio-temporal graph neural network models to process this representation
    and take advantage of both the finer-grained information and the relationships existing between the
    different clusters of meters. We compare these models on a widely used, openly available, benchmark
    against a competitive baseline which only accounts for the total load profile. Within these settings,
    we show that the proposed methodology improves forecasting accuracy.
  bibtex: |-
    @inproceedings{eandi2022spatio,
      title = {{Spatio-Temporal Graph Neural Networks for Aggregate Load Forecasting}},
      author = {Simone Eandi and Andrea Cini and Slobodan Lukovic and Cesare Alippi},
      booktitle = {2022 International Joint Conference on Neural Networks (IJCNN)},
      year = {2022},
      pages = {1--8},
      doi = {10.1109/ijcnn55064.2022.9892780},
      url = {https://ieeexplore.ieee.org/document/9892780}
    }
- title: 'Filling the G_ap_s: Multivariate Time Series Imputation by Graph Neural Networks'
  authors: A. Cini, I. Marisca, C. Alippi
  venue: ICLR
  year: 2022
  url: https://openreview.net/forum?id=kOu3-S3wJ7
  pdf: https://arxiv.org/pdf/2108.00298
  code: https://github.com/Graph-Machine-Learning-Group/grin
  abstract: >-
    Dealing with missing values and incomplete time series is a labor-intensive, tedious, inevitable task
    when handling data coming from real-world applications. Effective spatio-temporal representations
    would allow imputation methods to reconstruct missing temporal data by exploiting information coming
    from sensors at different locations. However, standard methods fall short in capturing the nonlinear
    time and space dependencies existing within networks of interconnected sensors and do not take full
    advantage of the available - and often strong - relational information. Notably, most state-of-the-art
    imputation methods based on deep learning do not explicitly model relational aspects and, in any case,
    do not exploit processing frameworks able to adequately represent structured spatio-temporal data.
    Conversely, graph neural networks have recently surged in popularity as both expressive and scalable
    tools for processing sequential data with relational inductive biases. In this work, we present the
    first assessment of graph neural networks in the context of multivariate time series imputation. In
    particular, we introduce a novel graph neural network architecture, named GRIN, which aims at reconstructing
    missing data in the different channels of a multivariate time series by learning spatio-temporal representations
    through message passing. Empirical results show that our model outperforms state-of-the-art methods
    in the imputation task on relevant real-world benchmarks with mean absolute error improvements often
    higher than 20%.
  bibtex: |-
    @inproceedings{cini2022filling,
      title = {{Filling the G\_ap\_s: Multivariate Time Series Imputation by Graph Neural Networks}},
      author = {Andrea Cini and Ivan Marisca and Cesare Alippi},
      booktitle = {International Conference on Learning Representations},
      year = {2022},
      url = {https://openreview.net/forum?id=kOu3-S3wJ7}
    }
- title: Deep Reinforcement Learning with Weighted Q-Learning
  authors: A. Cini, C. D'Eramo, J. Peters, C. Alippi
  venue: RLDM
  year: 2022
  url: https://arxiv.org/abs/2003.09280
  pdf: https://arxiv.org/pdf/2003.09280
  abstract: >-
    Reinforcement learning algorithms based on Q-learning are driving Deep Reinforcement Learning (DRL)
    research towards solving complex problems and achieving super-human performance on many of them. Nevertheless,
    Q-Learning is known to be positively biased since it learns by using the maximum over noisy estimates
    of expected values. Systematic overestimation of the action values coupled with the inherently high
    variance of DRL methods can lead to incrementally accumulate errors, causing learning algorithms to
    diverge. Ideally, we would like DRL agents to take into account their own uncertainty about the optimality
    of each action, and be able to exploit it to make more informed estimations of the expected return.
    In this regard, Weighted Q-Learning (WQL) effectively reduces bias and shows remarkable results in
    stochastic environments. WQL uses a weighted sum of the estimated action values, where the weights
    correspond to the probability of each action value being the maximum; however, the computation of
    these probabilities is only practical in the tabular setting. In this work, we provide methodological
    advances to benefit from the WQL properties in DRL, by using neural networks trained with Dropout
    as an effective approximation of deep Gaussian processes. In particular, we adopt the Concrete Dropout
    variant to obtain calibrated estimates of epistemic uncertainty in DRL. The estimator, then, is obtained
    by taking several stochastic forward passes through the action-value network and computing the weights
    in a Monte Carlo fashion. Such weights are Bayesian estimates of the probability of each action value
    corresponding to the maximum w.r.t. a posterior probability distribution estimated by Dropout. We
    show how our novel Deep Weighted Q-Learning algorithm reduces the bias w.r.t. relevant baselines and
    provides empirical evidence of its advantages on representative benchmarks.
  bibtex: |-
    @inproceedings{cini2022deep,
      title = {{Deep Reinforcement Learning with Weighted Q-Learning}},
      author = {Andrea Cini and Carlo D'Eramo and Jan Peters and Cesare Alippi},
      booktitle = {The Multi-disciplinary Conference on Reinforcement Learning and Decision Making (RLDM)},
      year = {2022},
      url = {https://arxiv.org/abs/2003.09280}
    }
- title: Graph Neural Networks for High-Level Synthesis Design Space Exploration
  authors: L. Ferretti, A. Cini, G. Zacharopoulos, C. Alippi, L. Pozzi
  venue: ACM TODAES
  year: 2022
  url: https://doi.org/10.1145/3570925
  abstract: >-
    High-level Synthesis (HLS) Design-Space Exploration (DSE) aims at identifying Pareto-optimal synthesis
    configurations whose exhaustive search is unfeasible due to the design-space dimensionality and the
    prohibitive computational cost of the synthesis process. Within this framework, we address the design
    automation problem by proposing graph neural networks that jointly predict acceleration performance
    and hardware costs of a synthesized behavioral specification given optimization directives. Learned
    models can be used to rapidly approach the Pareto curve by guiding the DSE, taking into account performance
    and cost estimates. The proposed method outperforms traditional HLS-driven DSE approaches, by accounting
    for the arbitrary length of computer programs and the invariant properties of the input. We propose
    a novel hybrid control and dataflow graph representation that enables training the graph neural network
    on specifications of different hardware accelerators. Our approach achieves prediction accuracy comparable
    with that of state-of-the-art simulators without having access to analytical models of the HLS compiler.
    Finally, the learned representation can be exploited for DSE in unexplored configuration spaces by
    fine-tuning on a small number of samples from the new target domain. The outcome of the empirical
    evaluation of this transfer learning shows strong results against state-of-the-art baselines in relevant
    benchmarks.
  bibtex: |-
    @article{ferretti2022graph,
      title = {{Graph Neural Networks for High-Level Synthesis Design Space Exploration}},
      author = {Lorenzo Ferretti and Andrea Cini and Georgios Zacharopoulos and Cesare Alippi and Laura Pozzi},
      journal = {ACM Transactions on Design Automation of Electronic Systems},
      year = {2022},
      volume = {28},
      number = {2},
      pages = {1--20},
      doi = {10.1145/3570925},
      url = {https://doi.org/10.1145/3570925}
    }
- title: Gaussian Approximation for Bias Reduction in Q-Learning
  authors: C. D'Eramo, A. Cini, A. Nuara, M. Pirotta, C. Alippi, J. Peters, M. Restelli
  venue: JMLR
  year: 2021
  url: http://jmlr.org/papers/v22/20-633.html
  pdf: https://jmlr.org/papers/volume22/20-633/20-633.pdf
  abstract: >-
    Temporal-Difference off-policy algorithms are among the building blocks of reinforcement learning
    (RL). Within this family, Q-Learning is arguably the most famous one, which has been widely studied
    and extended. The update rule of Q-learning involves the use of the maximum operator to estimate the
    maximum expected value of the return. However, this estimate is positively biased, and may hinder
    the learning process, especially in stochastic environments and when function approximation is used.
    We introduce the Weighted Estimator as an effective solution to mitigate the negative effects of overestimation
    in Q-Learning. The Weighted Estimator estimates the maximum expected value as a weighted sum of the
    action values, with the weights being the probabilities that each action value is the maximum. In
    this work, we study the problem from the statistical perspective of estimating the maximum expected
    value of a set of random variables and provide bounds to the bias and the variance of the Weighted
    Estimator, showing its advantages over other estimators present in literature. Then, we derive algorithms
    to enable the use of the Weighted Estimator, in place of the Maximum Estimator, in online and batch
    RL, and we introduce a novel algorithm for deep RL. Finally, we empirically evaluate our algorithms
    in a large set of heterogeneous problems, encompassing discrete and continuous, low and high dimensional,
    deterministic and stochastic environments. Experimental results show the effectiveness of the Weighted
    Estimator in controlling the bias of the estimate, resulting in better performance than representative
    baselines and robust learning w.r.t. a large set of diverse environments.
  bibtex: |-
    @article{JMLR:v22:20-633,
      author  = {Carlo D'Eramo and Andrea Cini and Alessandro Nuara and Matteo Pirotta and Cesare Alippi and Jan Peters and Marcello Restelli},
      title   = {Gaussian Approximation for Bias Reduction in Q-Learning},
      journal = {Journal of Machine Learning Research},
      year    = {2021},
      volume  = {22},
      number  = {277},
      pages   = {1--51},
      url     = {http://jmlr.org/papers/v22/20-633.html}
    }
- title: Deep Reinforcement Learning Policies for Underactuated Satellite Attitude Control
  authors: M. E. Hariry, A. Cini, G. Mellone, A. Balossino
  venue: NeurIPS Workshop on Deployable Decision-Making in Embodied Systems
  year: 2021
  url: https://arxiv.org/abs/2505.00165
  pdf: https://arxiv.org/pdf/2505.00165
  abstract: >-
    Autonomy is a key challenge for future space exploration endeavours. Deep Reinforcement Learning holds
    the promises for developing agents able to learn complex behaviours simply by interacting with their
    environment. This paper investigates the use of Reinforcement Learning for the satellite attitude
    control problem, namely the angular reorientation of a spacecraft with respect to an in- ertial frame
    of reference. In the proposed approach, a set of control policies are implemented as neural networks
    trained with a custom version of the Proximal Policy Optimization algorithm to maneuver a small satellite
    from a random starting angle to a given pointing target. In particular, we address the problem for
    two working conditions: the nominal case, in which all the actuators (a set of 3 reac- tion wheels)
    are working properly, and the underactuated case, where an actuator failure is simulated randomly
    along with one of the axes. We show that the agents learn to effectively perform large-angle slew
    maneuvers with fast convergence and industry-standard pointing accuracy. Furthermore, we test the
    proposed method on representative hardware, showing that by taking adequate measures controllers trained
    in simulation can perform well in real systems.
  bibtex: |-
    @inproceedings{hariry2021deep,
      title = {{Deep Reinforcement Learning Policies for Underactuated Satellite Attitude Control}},
      author = {Matteo El Hariry and Andrea Cini and Giacomo Mellone and Alessandro Balossino},
      booktitle = {NeurIPS 2021 Workshop on Deployable Decision-Making in Embodied Systems},
      year = {2021},
      url = {https://arxiv.org/abs/2505.00165}
    }
- title: Cluster-based Aggregate Load Forecasting with Deep Neural Networks
  authors: A. Cini, S. Lukovic, C. Alippi
  venue: IJCNN
  year: 2020
  url: https://ieeexplore.ieee.org/document/9207503/
  pdf: /assets/pdf/cini2020cluster.pdf
  abstract: >-
    Highly accurate power demand forecasting represents one of key challenges of Smart Grid applications.
    In this setting, a large number of Smart Meters produces huge amounts of data that need to be processed
    to predict the load requested by the grid. Due to the high dimensionality of the problem, this often
    results in the adoption of simple aggregation strategies for the power that fail in capturing the
    relational information existing among the different types of user. A possible alternative, known as
    Cluster-based Aggregate Forecasting, consists in clustering the load profiles and, on top of that,
    building predictors of the aggregate at the cluster-level. In this work we explore the technique in
    the context of predictors based on deep recurrent neural networks and address the scalability issues
    presenting neural architectures adequate to process cluster-level aggregates. The proposed methods
    are finally evaluated both on a publicly available benchmark and a heterogenous dataset of Smart Meter
    data from an entire, medium-sized, Swiss town.
