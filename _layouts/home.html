---
layout: default
---
<section class="hero">
  <img class="hero-photo" src="{{ site.author.photo | relative_url }}" alt="Portrait of {{ site.author.name }}" width="180" height="211">
  <div class="hero-text">
    <h1>{{ site.author.name }}</h1>
    <p class="hero-tagline">{{ site.tagline }}</p>
    {%- if site.affiliation %}
    <p class="hero-affiliation">{{ site.affiliation }}</p>
    {%- endif %}
    {% include social.html %}
  </div>
</section>

<div class="prose">
  {{ content }}
</div>

{%- if page.news %}
<section class="section">
  <div class="section-head">
    <h2>News</h2>
    <a class="more" href="{{ '/news/' | relative_url }}">All news →</a>
  </div>
  {% include news.html limit=site.news_limit %}
</section>
{%- endif %}
