<ul class="social">
  {%- if site.social.email %}
  <li><a href="mailto:{{ site.social.email }}" aria-label="Email" title="Email">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M3 6.5h18v11H3zM3.5 7l8.5 6.5L20.5 7"/></svg>
  </a></li>
  {%- endif %}
  {%- if site.social.scholar %}
  <li><a href="https://scholar.google.com/citations?user={{ site.social.scholar }}" aria-label="Google Scholar" title="Google Scholar">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 3 1 9.5l4 2.4V17h2v-3.9l5 3 11-6.6zm0 9.6L4.8 9.5 12 5.3l7.2 4.2zM7 14.4V18c0 1.7 2.2 3 5 3s5-1.3 5-3v-3.6l-5 3z"/></svg>
  </a></li>
  {%- endif %}
  {%- if site.social.github %}
  <li><a href="https://github.com/{{ site.social.github }}" aria-label="GitHub" title="GitHub">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-3.2 19.5c.5.1.7-.2.7-.5v-1.7c-2.8.6-3.4-1.3-3.4-1.3-.4-1.2-1.1-1.5-1.1-1.5-.9-.6.1-.6.1-.6 1 .1 1.5 1 1.5 1 .9 1.6 2.4 1.1 3 .9.1-.7.4-1.1.6-1.4-2.2-.3-4.6-1.1-4.6-5 0-1.1.4-2 1-2.7-.1-.3-.4-1.3.1-2.7 0 0 .8-.3 2.8 1a9.6 9.6 0 0 1 5 0c1.9-1.3 2.8-1 2.8-1 .5 1.4.2 2.4.1 2.7.6.7 1 1.6 1 2.7 0 3.9-2.3 4.7-4.6 5 .4.3.7.9.7 1.9V21c0 .3.2.6.7.5A10 10 0 0 0 12 2z"/></svg>
  </a></li>
  {%- endif %}
  {%- if site.social.twitter %}
  <li><a href="https://x.com/{{ site.social.twitter }}" aria-label="X (Twitter)" title="X (Twitter)">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M17.8 3h3.1l-6.8 7.7L22 21h-6.2l-4.9-6.4L5.3 21H2.2l7.2-8.3L2 3h6.4l4.4 5.8zm-1.1 16.2h1.7L7.4 4.7H5.5z"/></svg>
  </a></li>
  {%- endif %}
  {%- if site.cv %}
  <li><a class="social-cv" href="{{ site.cv | relative_url }}">CV</a></li>
  {%- endif %}
</ul>
