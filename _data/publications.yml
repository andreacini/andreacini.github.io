- title: Learning to Forecast on Multiple Spatiotemporal Hierarchies
  authors: V. Moretti, C. Alippi, A. Cini
  venue: arXiv preprint
  year: 2026
  url: https://arxiv.org/abs/2610.21414
  pdf: https://arxiv.org/pdf/2610.21414
  abstract: >-
    Hierarchical forecasting exploits aggregation structures that expose multiple views of the same
    underlying spatiotemporal forecasting problem, while ensuring coherence among forecasts. Individual
    series provide fine-grained information, while progressively coarser aggregates reveal temporal and
    spatial patterns at different scales. In the associated deep learning architectures, the hierarchy
    determines which aggregate series are available and how they are processed together with individual
    series (e.g., through reconciliation or message-passing operators). Different hierarchies thus
    provide distinct learning signals and inductive biases for forecasting the same collection of time
    series. Nonetheless, existing architectures are typically trained on a single, often fixed,
    structure. In this work, we propose a graph deep learning framework that leverages variations across
    hierarchies as multi-task regularization. We show that jointly learning across these structures can
    reduce over-specialization to any single hierarchy and improve forecasting performance. Indeed,
    training across hierarchies provides an inductive bias toward representations that are useful across
    different structures, and as such, generalize better. Making forecasts coherent with the aggregation
    constraints for each sampled hierarchy is computationally expensive: to complement the framework, we
    propose a novel operator-based on a top-down approach-that produces coherent forecasts with linear
    time and space complexity w.r.t. the hierarchy size. Experiments show that our approach improves
    forecasting accuracy over training on a single structure and is competitive with current state-of-the-art methods.
  bibtex: |-
    @misc{moretti2026learning,
      title = {{Learning to Forecast on Multiple Spatiotemporal Hierarchies}},
      author = {Valentina Moretti and Cesare Alippi and Andrea Cini},
      eprint = {2610.21414},
      archivePrefix = {arXiv},
      year = {2026},
      url = {https://arxiv.org/abs/2610.21414}
    }
- title: Continual Graph Multi-Agent Reinforcement Learning
  authors: T. Marzi, A. Hendawy, J. Peters, C. D'Eramo, A. Cini, C. Alippi
  venue: arXiv preprint
  year: 2026
  url: https://arxiv.org/abs/2610.10302
  pdf: https://arxiv.org/pdf/2610.10302
  abstract: >-
    In Continual Multi-Agent Reinforcement Learning (CMARL), agents learn cooperative policies across
    sequences of tasks, aiming to adapt effectively to new tasks while preserving the ability to solve
    previously encountered ones. In many applications, tasks differ in their underlying structure, which
    can represent, for example, distinct operational conditions or target configurations (e.g., different
    network topologies in power grids or arrangements in formation control). Existing CMARL methods lack
    dedicated mechanisms to leverage this structural information when learning new tasks, failing to promote
    transfer and mitigate forgetting. To fill this gap, we propose Continual Graph Multi-Agent Reinforcement
    Learning (CGMARL), a novel framework for CMARL problems in which task sequences are mapped into a
    series of attributed graphs, each modeling a task-specific structure. In CGMARL, each graph determines
    the environment dynamics (next states and/or rewards) and the number of agents for the corresponding
    task. Then, we present Graph-based Formation (GRAFO), the first CGMARL benchmark, and show how forgetting
    arises in this setting. Finally, to address this limitation, we propose Frozen Graph Encoder (FROG),
    a method that relies on a frozen graph backbone to preserve past structural information in graph-based
    CMARL policies. Experiments on GRAFO show that pairing FROG with existing CL methods substantially
    improves performance on multiple CGMARL scenarios.
  bibtex: |-
    @misc{marzi2026continual,
      title = {{Continual Graph Multi-Agent Reinforcement Learning}},
      author = {Tommaso Marzi and Ahmed Hendawy and Jan Peters and Carlo D'Eramo and Andrea Cini and Cesare Alippi},
      eprint = {2610.10302},
      archivePrefix = {arXiv},
      year = {2026},
      url = {https://arxiv.org/abs/2610.10302}
    }
- title: Graph State-Space Models and Latent Relational Inference
  authors: D. Zambon, A. Cini, C. Alippi
  venue: arXiv preprint
  year: 2026
  url: https://arxiv.org/abs/2301.01741
  pdf: https://arxiv.org/pdf/2301.01741
  abstract: >-
    State-space models effectively model multivariate time series by updating over time a representation
    of the system state from which predictions are made. The state representation is usually a vector
    without any explicit structure. Relational inductive biases, e.g., associated with dependencies among
    input signals and state representations, are not explicitly exploited during processing, leaving unattended
    opportunities for effective modeling. The manuscript aims to fill this gap by matching state-space
    modeling and spatio-temporal data where the relational information, say the functional graph capturing
    latent dependencies, is learned directly from time series. In particular, we propose Graph State-Space
    Models, a novel probabilistic framework that jointly learns state-space dynamics and latent relational
    structures end-to-end on downstream tasks. The proposed framework generalizes several state-of-the-art
    methods and, as we show, is effective in extracting meaningful latent relational structures and obtaining
    accurate forecasts.
  bibtex: |-
    @misc{zambon2026graph,
      title = {{Graph State-Space Models and Latent Relational Inference}},
      author = {Daniele Zambon and Andrea Cini and Cesare Alippi},
      eprint = {2301.01741},
      archivePrefix = {arXiv},
      year = {2026},
      url = {https://arxiv.org/abs/2301.01741}
    }

- title: Why Do Time Series Models Need Long Context Windows?
  authors: L. Butera, G. De Felice, A. Cini, C. Alippi
  venue: NeurIPS
  year: 2026
  url: https://arxiv.org/abs/2606.01999
  pdf: https://arxiv.org/pdf/2606.01999
  abstract: >-
    Modern deep learning models for forecasting groups of time series rely on increasingly longer observation
    windows. However, the benefit of increasing the window size is often simply attributed to capturing
    long-range dependencies, and broader discussion on how global forecasting models leverage input observations
    has been limited. In this paper, we show that forecasting groups of time series involves two objectives:
    (i) generative process identification (GPI), i.e., inferring the specific process generating the input
    sequence, and (ii) conditional forecasting (CF), i.e., predicting future values given input observations.
    From this perspective, optimal predictions can be interpreted as an average over plausible data-generating
    processes, weighted by their likelihood given the input window. This suggests another explanation
    for the benefits of long context windows: they reduce the uncertainty about which specific process
    is generating the input time series during operation. We prove that even for processes with memory
    length <em>P</em>, an input window size strictly larger than <em>P</em> is necessary to achieve the minimum attainable
    error. Finally, we show how decoupling GPI and CF can improve computational scalability without compromising
    accuracy. Experiments on synthetic and real-world data validate our insights and their relevance for
    designing forecasting architectures.
  bibtex: |-
    @inproceedings{butera2026time,
      title = {{Why Do Time Series Models Need Long Context Windows?}},
      author = {Luca Butera and Giovanni De Felice and Andrea Cini and Cesare Alippi},
      booktitle = {Advances in Neural Information Processing Systems},
      year = {2026},
      url = {https://arxiv.org/abs/2606.01999}
    }
- title: 'Position: Current Benchmarking Hinders Real Progress in Deep Learning for Time Series Forecasting'
  authors: V. Moretti, I. Marisca, C. Alippi, A. Cini
  venue: ICML Position Paper Track
  year: 2026
  url: https://openreview.net/forum?id=gtwbLmO7Wb
  pdf: https://arxiv.org/pdf/2512.22702
  code: https://github.com/valentina-moretti/deep-forecasting-benchmarking-issues
  abstract: >-
    Deep learning models have grown popular in time series applications. However, the large quantity of
    newly proposed architectures and the often contradictory empirical results make it difficult to assess
    which design choice and model component drives performance. In this position paper, we argue that
    current benchmarking practices fail to identify the factors responsible for performance differences,
    thus slowing down progress in the field. In particular, differences in crucial design dimensions are
    overlooked when comparing architectures, ultimately leading to inconsistent outcomes. To support our
    position, we show that such differences-often treated as mere implementation details-can have a greater
    impact than adopting specific sequence modeling layers. We discuss how overlooked aspects (such as
    globality and locality) can (1) fundamentally change the class of the forecasting method and (2) drastically
    affect empirical results. Our findings suggest rethinking our benchmarking practices and focusing
    on the foundational aspects of the forecasting problem when designing and comparing architectures.
    As a concrete step, we propose an auxiliary forecasting model card, i.e., a template with a set of
    fields to characterize existing and new forecasting architectures based on key design choices.
  bibtex: |-
    @inproceedings{moretti2026current,
      title = {{Position: Current Benchmarking Hinders Real Progress in Deep Learning for Time Series Forecasting}},
      author = {Moretti, Valentina and Marisca, Ivan and Alippi, Cesare and Cini, Andrea},
      booktitle = {Proceedings of the 43rd International Conference on Machine Learning},
      pages = {171515--171539},
      year = {2026},
      volume = {306},
      series = {Proceedings of Machine Learning Research},
      publisher = {PMLR},
      url = {https://proceedings.mlr.press/v306/moretti26a.html}
    }
- title: 'ResCP: Reservoir Conformal Prediction for Time Series Forecasting'
  authors: R. Neglia, A. Cini, M. M. Bronstein, F. M. Bianchi
  venue: ICLR
  year: 2026
  url: https://openreview.net/forum?id=WGqibe5H3W
  pdf: https://arxiv.org/pdf/2510.05060
  code: https://github.com/NGMLGroup/reservoir-conformal-prediction
  abstract: >-
    Conformal prediction offers a powerful framework for building distribution-free prediction intervals
    for exchangeable data. Existing methods that extend conformal prediction to sequential data rely on
    fitting a relatively complex model to capture temporal dependencies. However, these methods can fail
    if the sample size is small and often require expensive retraining when the underlying data distribution
    changes. To overcome these limitations, we propose Reservoir Conformal Prediction (ResCP), a novel
    training-free conformal prediction method for time series. Our approach leverages the efficiency and
    representation learning capabilities of reservoir computing to dynamically reweight conformity scores.
    In particular, we compute similarity scores among reservoir states and use them to adaptively reweight
    the observed residuals at each step. With this approach, ResCP enables us to account for local temporal
    dynamics when modeling the error distribution without compromising computational scalability. We prove
    that, under reasonable assumptions, ResCP achieves asymptotic conditional coverage, and we empirically
    demonstrate its effectiveness across diverse forecasting tasks.
  bibtex: |-
    @inproceedings{neglia2026rescp,
      title = {{ResCP: Reservoir Conformal Prediction for Time Series Forecasting}},
      author = {Roberto Neglia and Andrea Cini and Michael M. Bronstein and Filippo Maria Bianchi},
      booktitle = {International Conference on Learning Representations},
      year = {2026},
      url = {https://openreview.net/forum?id=WGqibe5H3W}
    }
- title: Hierarchical Message-Passing Policies for Multi-Agent Reinforcement Learning
  authors: T. Marzi, C. Alippi, A. Cini
  venue: arXiv preprint
  year: 2025
  url: https://arxiv.org/abs/2507.23604
  pdf: https://arxiv.org/pdf/2507.23604
  abstract: >-
    Decentralized Multi-Agent Reinforcement Learning (MARL) methods allow for learning scalable multi-agent
    policies, but suffer from partial observability and induced non-stationarity. These challenges can
    be addressed by introducing mechanisms that facilitate coordination and high-level planning. Specifically,
    coordination and temporal abstraction can be achieved through communication (e.g., message passing)
    and Hierarchical Reinforcement Learning (HRL) approaches to decision-making. However, optimization
    issues limit the applicability of hierarchical policies to multi-agent systems. As such, the combination
    of these approaches has not been fully explored. To fill this void, we propose a novel and effective
    methodology for learning multi-agent hierarchies of message-passing policies. We adopt the feudal
    HRL framework and rely on a hierarchical graph structure for planning and coordination among agents.
    Agents at lower levels in the hierarchy receive goals from the upper levels and exchange messages
    with neighboring agents at the same level. To learn hierarchical multi-agent policies, we design a
    novel reward-assignment method based on training the lower-level policies to maximize the advantage
    function associated with the upper levels. Results on relevant benchmarks show that our method performs
    favorably compared to the state of the art.
  bibtex: |-
    @misc{marzi2025hierarchical,
      title = {{Hierarchical Message-Passing Policies for Multi-Agent Reinforcement Learning}},
      author = {Tommaso Marzi and Cesare Alippi and Andrea Cini},
      eprint = {2507.23604},
      archivePrefix = {arXiv},
      year = {2025},
      url = {https://arxiv.org/abs/2507.23604}
    }
- title: Learning to Predict Global Atrial Fibrillation Dynamics from Sparse Measurements
  authors: >-
    A. Jenkins, A. Cini, J. Barker, A. Sharp, A. Sau, V. Valentine, S. Valasang, X. Li, T. Wong, T. Betts,
    D. Mandic, C. Alippi, F. S. Ng
  venue: arXiv preprint
  year: 2025
  url: https://arxiv.org/abs/2502.09473
  pdf: https://arxiv.org/pdf/2502.09473
  abstract: >-
    Catheter ablation of Atrial Fibrillation (AF) consists of a one-size-fits-all treatment with limited
    success in persistent AF. This may be due to our inability to map the dynamics of AF with the limited
    resolution and coverage provided by sequential contact mapping catheters, preventing effective patient
    phenotyping for personalised, targeted ablation. Here we introduce FibMap, a graph recurrent neural
    network model that reconstructs global AF dynamics from sparse measurements. Trained and validated
    on 51 non-contact whole atria recordings, FibMap reconstructs whole atria dynamics from 10% surface
    coverage, achieving a 210% lower mean absolute error and an order of magnitude higher performance
    in tracking phase singularities compared to baseline methods. Clinical utility of FibMap is demonstrated
    on real-world contact mapping recordings, achieving reconstruction fidelity comparable to non-contact
    mapping. FibMap's state-spaces and patient-specific parameters offer insights for electrophenotyping
    AF. Integrating FibMap into clinical practice could enable personalised AF care and improve outcomes.
  bibtex: |-
    @misc{jenkins2025learning,
      title = {{Learning to Predict Global Atrial Fibrillation Dynamics from Sparse Measurements}},
      author = {Alexander Jenkins and Andrea Cini and Joseph Barker and Alexander Sharp and Arunashis Sau and Varun Valentine and Srushti Valasang and Xinyang Li and Tom Wong and Timothy Betts and Danilo Mandic and Cesare Alippi and Fu Siong Ng},
      eprint = {2502.09473},
      archivePrefix = {arXiv},
      year = {2025},
      url = {https://arxiv.org/abs/2502.09473}
    }
- title: Relational Conformal Prediction for Correlated Time Series
  authors: A. Cini, A. Jenkins, D. Mandic, C. Alippi, F. M. Bianchi
  venue: ICML
  year: 2025
  url: https://openreview.net/forum?id=wwYDQ1vXcZ
  pdf: https://arxiv.org/pdf/2502.09443
  code: https://github.com/andreacini/corel
  abstract: >-
    We address the problem of uncertainty quantification in time series forecasting by exploiting observations
    at correlated sequences. Relational deep learning methods leveraging graph representations are among
    the most effective tools for obtaining point estimates from spatiotemporal data and correlated time
    series. However, the problem of exploiting relational structures to estimate the uncertainty of such
    predictions has been largely overlooked in the same context. To this end, we propose a novel distribution-free
    approach based on the conformal prediction framework and quantile regression. Despite the recent applications
    of conformal prediction to sequential data, existing methods operate independently on each target
    time series and do not account for relationships among them when constructing the prediction interval.
    We fill this void by introducing a novel conformal prediction method based on graph deep learning
    operators. Our approach, named Conformal Relational Prediction (CoRel), does not require the relational
    structure (graph) to be known a priori and can be applied on top of any pre-trained predictor. Additionally,
    CoRel includes an adaptive component to handle non-exchangeable data and changes in the input time
    series. Our approach provides accurate coverage and achieves state-of-the-art uncertainty quantification
    in relevant benchmarks.
  bibtex: |-
    @inproceedings{cini2025relational,
      title = {{Relational Conformal Prediction for Correlated Time Series}},
      author = {Cini, Andrea and Jenkins, Alexander and Mandic, Danilo and Alippi, Cesare and Bianchi, Filippo Maria},
      booktitle = {Proceedings of the 42nd International Conference on Machine Learning},
      pages = {10949--10965},
