<ul class="projects">
  {%- for s in include.items %}
  <li class="project">
    {%- if s.logo %}
    <img class="project-logo" src="{{ s.logo | relative_url }}" alt="" width="64" height="64">
    {%- endif %}
    <div class="project-body">
      <h2>{{ s.name }}</h2>
      {%- if s.role %}
      <div class="project-role">{{ s.role }}</div>
      {%- endif %}
      <p>{{ s.description }}</p>
      <div class="pub-actions">
        {%- for l in s.links %}
        <a href="{{ l.url }}">{{ l.title }}</a>
        {%- endfor %}
      </div>
    </div>
  </li>
  {%- endfor %}
</ul>
