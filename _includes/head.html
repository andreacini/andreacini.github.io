<meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {%- if page.title and page.layout != "home" %}
    <title>{{ page.title }} · {{ site.title }}</title>
    {%- else %}
    <title>{{ site.title }}</title>
    {%- endif %}
    <meta name="description" content="{{ page.description | default: site.description | strip_html | escape }}">
    <meta name="author" content="{{ site.author.name }}">
    {%- if site.google_site_verification %}
    <meta name="google-site-verification" content="{{ site.google_site_verification }}">
    {%- endif %}
    <meta property="og:title" content="{{ page.title | default: site.title }}">
    <meta property="og:description" content="{{ page.description | default: site.description | strip_html | escape }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:image" content="{{ site.author.photo | absolute_url }}">
    <link rel="canonical" href="{{ page.url | replace: 'index.html', '' | absolute_url }}">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>{{ site.icon }}</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap">
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem("theme");
        if (t) document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
